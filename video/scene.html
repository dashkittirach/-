<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDGE Promo Scene</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000; color: #c9cfdd; font: 13px/1.4 "JetBrains Mono", ui-monospace, monospace; overflow: hidden; }
  canvas { display: block; }
  body:not(.capture) { display: grid; place-items: center; height: 100vh; }
  body:not(.capture) canvas { max-width: 100vw; max-height: calc(100vh - 56px); width: auto; height: auto; aspect-ratio: 16 / 9; }
  .hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  .hud button { background: #1a2034; color: inherit; border: 1px solid #2b3350; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .hud input[type=range] { flex: 1; accent-color: #22dba0; }
  body.capture .hud { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <button id="play">▶ play</button>
  <input type="range" id="scrub" min="0" max="1" step="0.001" value="0">
  <span id="time">0.00s</span>
  <span id="scene"></span>
</div>
<audio id="audio" preload="auto"></audio>
<script type="module">
import { createScene } from './scene.js';

const q = new URLSearchParams(location.search);
const capture = q.has('capture');
if (capture) document.body.classList.add('capture');

const FONTS = [
  ['Inter', 'inter-latin-400-normal', 400], ['Inter', 'inter-latin-600-normal', 600], ['Inter', 'inter-latin-800-normal', 800],
  ['JetBrains Mono', 'jetbrains-mono-latin-400-normal', 400], ['JetBrains Mono', 'jetbrains-mono-latin-700-normal', 700],
  ['IBM Plex Sans Thai', 'ibm-plex-sans-thai-thai-400-normal', 400], ['IBM Plex Sans Thai', 'ibm-plex-sans-thai-thai-600-normal', 600],
];

window.__ready = (async () => {
  await Promise.all(FONTS.map(async ([family, file, weight]) => {
    const f = new FontFace(family, `url(../assets/fonts/${file}.woff2)`, { weight: String(weight) });
    document.fonts.add(await f.load());
  }));
  const board = await (await fetch('storyboard.json')).json();
  const canvas = document.getElementById('c');
  canvas.width = Number(q.get('w') || board.width);
  canvas.height = Number(q.get('h') || board.height);
  const scene = await createScene(canvas, board);

  window.renderFrame = (t, i) => { scene.renderFrame(t, i); scene.gl.finish(); };
  window.grab = (type = 'image/png', quality = 0.95) => canvas.toDataURL(type, quality);
  window.meta = { duration: scene.duration, fps: board.fps, width: canvas.width, height: canvas.height };

  if (capture) { scene.renderFrame(0); return window.meta; }

  // ---- interactive player (the "video" is just this page running) ----
  const audio = document.getElementById('audio');
  audio.src = '../music/out/soundtrack.wav'; // run `python3 music/compose.py` to create it
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), sceneEl = document.getElementById('scene');
  const btn = document.getElementById('play');
  let playing = false, t = Number(q.get('t') || 0), last = 0;
  const bar = 60 / board.bpm * board.beatsPerBar;
  const show = () => {
    scene.renderFrame(t);
    scrub.value = t / scene.duration;
    timeEl.textContent = t.toFixed(2) + 's';
    sceneEl.textContent = board.scenes.find((s) => t >= s.bars[0] * bar && t < s.bars[1] * bar)?.id ?? '';
  };
  const loop = (now) => {
    if (!playing) return;
    t = audio.readyState >= 2 && !audio.paused ? audio.currentTime : t + (now - last) / 1000;
    last = now;
    if (t >= scene.duration) { t = 0; audio.currentTime = 0; }
    show();
    requestAnimationFrame(loop);
  };
  const toggle = () => {
    playing = !playing;
    btn.textContent = playing ? '❚❚ pause' : '▶ play';
    if (playing) { audio.currentTime = t; audio.play().catch(() => {}); last = performance.now(); requestAnimationFrame(loop); }
    else audio.pause();
  };
  btn.onclick = toggle;
  scrub.oninput = () => { t = scrub.value * scene.duration; audio.currentTime = t; show(); };
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.key === 'ArrowRight') { t = Math.min(scene.duration, t + (e.shiftKey ? 1 : 1 / board.fps)); audio.currentTime = t; show(); }
    if (e.key === 'ArrowLeft') { t = Math.max(0, t - (e.shiftKey ? 1 : 1 / board.fps)); audio.currentTime = t; show(); }
  });
  show();
  return window.meta;
})();
</script>
</body>
</html>
